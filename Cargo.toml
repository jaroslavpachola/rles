[package]
name = "rles"
version = "0.5.1"
edition = "2024"
description = "A small terminal pager written in Rust — a less replacement"
license = "MIT"
repository = "https://github.com/jaroslavpachola/rles"
homepage = "https://github.com/jaroslavpachola/rles"
readme = "README.md"
keywords = ["pager", "less", "terminal", "cli"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = { version = "0.28", features = ["use-dev-tty"] }
regex = "1"

[profile.release]
lto = true
strip = true
